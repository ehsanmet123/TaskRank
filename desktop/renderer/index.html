<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskRank widget</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="drag-region">
        <div class="brand"><img class="logo" src="../assets/taskrank-store-icon.png" alt="TaskRank" /><strong>taskrank<span>.</span></strong></div>
        <div class="window-controls no-drag"><button id="minimize" aria-label="Minimize">−</button><button id="close" aria-label="Close">×</button></div>
      </header>
      <section class="heading"><div><p class="eyebrow">YOUR FOCUS</p><h1 id="heading">Today</h1></div><button id="sync" class="sync">↻ Sync</button></section>
      <p id="status" class="status">Connect Google to show your tasks.</p>
      <nav class="tabs"><button data-tab="Tasks">Tasks</button><button data-tab="Today" class="selected">Today</button><button data-tab="Done">Done</button></nav>
      <section id="tasks" class="tasks"></section>
      <footer><button id="connect" class="connect">Connect Google</button><button id="add" class="add">+ Add task</button><a id="android-app" class="android-link no-drag" href="#">Android app ↗</a></footer>
      <section id="editor" class="editor" hidden>
        <div class="editor-card">
          <h2 id="editor-title">New task</h2>
          <input id="task-input" maxlength="240" placeholder="What needs doing?" />
          <div class="editor-actions"><button id="cancel-edit" class="secondary">Cancel</button><button id="delete-task" class="delete" hidden>Delete</button><button id="save-task" class="add">Save</button></div>
        </div>
      </section>
      <aside id="celebration" class="celebration" hidden><span>🎉</span><div><strong>Nice work!</strong><small id="celebration-task"></small></div></aside>
    </main>
    <script src="./widget.js"></script>
  </body>
</html>
